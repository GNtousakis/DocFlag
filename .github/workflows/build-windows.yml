name: Build Windows package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -v

      - name: Build DocFlag.exe
        run: pyinstaller packaging/docflag.spec --noconfirm

      - name: Smoke-test the packaged app
        shell: pwsh
        run: |
          $app = Start-Process dist/DocFlag/DocFlag.exe -ArgumentList "--no-browser" -PassThru
          try {
            $ok = $false
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 2
              try {
                $page = Invoke-WebRequest http://127.0.0.1:8086 -UseBasicParsing
                if ($page.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw "DocFlag.exe did not start serving on port 8086" }
          } finally {
            Stop-Process -Id $app.Id -Force
          }

      # The build alone doesn't prove Windows OCR (winrt) and opencv were
      # bundled: run real OCR, an image diff and a Word diff in the .exe.
      # The runner only has English OCR, so Greek is skipped with a warning.
      - name: Self-test the packaged app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/DocFlag/DocFlag.exe -ArgumentList "--selftest","selftest.txt" -PassThru -Wait -NoNewWindow
          if (Test-Path selftest.txt) { Get-Content selftest.txt } else { Write-Host "no selftest output produced" }
          Write-Host "exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-log
          path: selftest.txt
          if-no-files-found: ignore

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/DocFlag -DestinationPath DocFlag-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DocFlag-windows
          path: DocFlag-windows.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DocFlag-windows.zip
